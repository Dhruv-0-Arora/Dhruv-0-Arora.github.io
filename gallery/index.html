    <link rel="canonical" href="https://darora1.me/gallery/" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (() => {
        // Mirrors themeForHour in src/lib/theme.ts: night before 07:00 and from 19:00.
        const t = new URLSearchParams(location.search).get("theme");
        const h = new Date().getHours();
        const dark = t === "dark" || (t !== "light" && (h < 7 || h >= 19));
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/gallery/main.tsx"></script>
  </body>
